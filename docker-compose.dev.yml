services:
  kafka:
    environment:
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
    ports:
      - "127.0.0.1:29092:29092"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8083:8080"

  usuarios-service:
    ports:
      - "127.0.0.1:8081:8081"

  casos-service:
    ports:
      - "127.0.0.1:8082:8082"

  partidas-service:
    ports:
      - "127.0.0.1:8000:8000"

  # Dev-only: the regression uses the public client hopedoku-test.
  # The base compose never defines this variable, so the gateway keeps
  # accepting only hopedoku-godot outside this override.
  api-gateway:
    environment:
      KEYCLOAK_ALLOWED_AZP: "hopedoku-godot,hopedoku-test"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"
