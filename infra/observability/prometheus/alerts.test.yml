rule_files:
  - /etc/prometheus/alerts.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'up{job="partidas-service",instance="partidas-service:8000"}'
        values: '0+0x5 1+0x4'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: DeathDokuServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: partidas-service
              instance: partidas-service:8000
            exp_annotations:
              summary: 'Servicio DeathDoku caído: partidas-service'
              description: 'Prometheus no ha podido consultar partidas-service:8000 durante al menos un minuto.'
      - eval_time: 1m30s
        alertname: DeathDokuServiceDown
        exp_alerts: []
